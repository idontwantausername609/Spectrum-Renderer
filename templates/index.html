<!DOCTYPE html>
<html>
<head>
    <title>Visible Spectrum Renderer</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle">🌙 Dark Mode</button>
    
    <div class="container">
        <h1>Visible Spectrum Renderer</h1>
        <p class="subtitle">Upload your Excel workbook and render visible spectra with NIST descriptor support</p>
        
        <form id="renderForm">
            <div class="form-group">
                <label for="file">Excel File *</label>
                <input type="file" id="file" name="file" accept=".xlsx,.xls" required>
            </div>
            
            <div class="form-group">
                <label for="sheet">Sheet Name (multi-select supported)</label>
                <select id="sheet" name="sheet" multiple size="6">
                    <option value="">Auto-detect (no selection)</option>
                </select>
                <div style="margin-top:8px; font-size:12px; color:#666;">Tip: hold Ctrl (Cmd on Mac) to select multiple sheets.</div>
                <div style="margin-top:8px;">
                    <label style="font-weight:600"><input type="checkbox" id="render_all_sheets" name="render_all_sheets"> Render all sheets</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="title">Spectrum Title (leave blank for random code)</label>
                <input type="text" id="title" name="title" placeholder="e.g., Oxygen">
            </div>
            
            <div class="form-group">
                <label>Render Image Modes</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="render_dark" value="dark" checked>
                        Dark Mode Image
                    </label>
                    <label>
                        <input type="checkbox" name="render_light" value="light" checked>
                        Light Mode Image
                    </label>
                    <label for="scaleMode">Scale</label>
                    <select id="scaleMode" name="scale_mode">
                      <option value="normalize" selected>Normalize</option>
                      <option value="raw">Raw</option>
                    </select>
                    <!-- Keep-top-N control removed: top-N is automatically detected server-side -->
                </div>
            </div>
            
            <button type="submit">Render Spectrum</button>
        </form>
        
        <div id="result"></div>
    </div>

    <!-- Fullscreen preview modal -->
    <div id="previewModal" class="modal" aria-hidden="true" role="dialog" aria-label="Image preview">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content" role="document">
            <button id="modalClose" class="modal-close" aria-label="Close preview">✕</button>
            <img id="modalImage" src="" alt="Preview" />
            <a id="modalDownload" class="modal-download" download>Download</a>
        </div>
    </div>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        
        // Load saved theme preference
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = '☀️ Light Mode';
        }
        
        // Toggle theme
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            themeToggle.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        
        // File upload and sheet loading
        const fileInput = document.getElementById('file');
        const sheetSelect = document.getElementById('sheet');
        const renderForm = document.getElementById('renderForm');
        const resultDiv = document.getElementById('result');
        const renderAllCheckbox = document.getElementById('render_all_sheets');
        let availableSheets = [];

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('scale_mode', document.getElementById('scaleMode').value);

            try {
                const response = await fetch('/api/sheets', { method: 'POST', body: formData });
                const data = await response.json();

                availableSheets = data.sheets || [];
                sheetSelect.innerHTML = '<option value="">Auto-detect (no selection)</option>';
                availableSheets.forEach(sheet => {
                    const option = document.createElement('option');
                    option.value = sheet;
                    option.textContent = sheet;
                    sheetSelect.appendChild(option);
                });
                // Uncheck render-all when loading a new file
                if (renderAllCheckbox) renderAllCheckbox.checked = false;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error loading sheets: ${error.message}</div>`;
            }
        });

        // Form submission
        renderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            if (!file) {
                resultDiv.innerHTML = '<div class="error">Please select a file</div>';
                return;
            }
            
            const renderDark = document.querySelector('input[name="render_dark"]').checked;
            const renderLight = document.querySelector('input[name="render_light"]').checked;
            
            if (!renderDark && !renderLight) {
                resultDiv.innerHTML = '<div class="error">Please select at least one render mode</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Rendering...</div>';

            try {
                const title = document.getElementById('title').value;

                // Determine sheets to render
                let selectedSheets = [];
                if (renderAllCheckbox && renderAllCheckbox.checked) {
                    selectedSheets = availableSheets.slice();
                } else {
                    selectedSheets = Array.from(sheetSelect.selectedOptions).map(o => o.value).filter(v => v !== '');
                }
                if (!selectedSheets || selectedSheets.length === 0) {
                    // Auto-detect mode (single render)
                    selectedSheets = [null];
                }

                let html = '';
                // For each selected sheet, render requested modes
                for (const sheetName of selectedSheets) {
                    const labelSheet = sheetName || 'Auto-detected sheet';
                    if (renderDark) {
                        const formData = new FormData();
                        formData.append('file', file);
                        if (sheetName) formData.append('sheet', sheetName);
                        formData.append('title', title);
                        formData.append('dark_mode', 'on');
                        formData.append('scale_mode', document.getElementById('scaleMode').value);
                        // keep_top_n is auto-detected server-side; do not send this field from the client.

                        const response = await fetch('/api/render', { method: 'POST', body: formData });
                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error || 'Unknown error');
                        }
                        const blob = await response.blob();
                        const url = URL.createObjectURL(blob);
                        html += '<div class="image-container"><div class="image-label">' + labelSheet + ' — Dark Mode</div><img src="' + url + '" alt="Dark Mode Spectrum"></div>';
                    }

                    if (renderLight) {
                        const formData = new FormData();
                        formData.append('file', file);
                        if (sheetName) formData.append('sheet', sheetName);
                        formData.append('scale_mode', document.getElementById('scaleMode').value);
                        // keep_top_n is auto-detected server-side; do not send this field from the client.
                        formData.append('title', title);

                        const response = await fetch('/api/render', { method: 'POST', body: formData });
                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error || 'Unknown error');
                        }
                        const blob = await response.blob();
                        const url = URL.createObjectURL(blob);
                        html += '<div class="image-container"><div class="image-label">' + labelSheet + ' — Light Mode</div><img src="' + url + '" alt="Light Mode Spectrum"></div>';
                    }
                }

                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        });

        // Fullscreen preview modal logic
        const previewModal = document.getElementById('previewModal');
        const modalImage = document.getElementById('modalImage');
        const modalClose = document.getElementById('modalClose');
        const modalDownload = document.getElementById('modalDownload');
        const modalBackdrop = document.getElementById('modalBackdrop');

        function openPreview(src, filename) {
            modalImage.src = src;
            modalImage.alt = filename || 'Spectrum preview';
            modalDownload.href = src;
            modalDownload.download = filename || 'spectrum.png';
            previewModal.classList.add('open');
            previewModal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closePreview() {
            previewModal.classList.remove('open');
            previewModal.setAttribute('aria-hidden', 'true');
            modalImage.src = '';
            document.body.style.overflow = '';
        }

        // Delegate click events on result images
        resultDiv.addEventListener('click', (ev) => {
            const t = ev.target;
            if (t && t.tagName === 'IMG') {
                // Open preview with same object URL and filename from alt
                openPreview(t.src, t.alt || 'spectrum.png');
            }
        });

        // Close interactions
        modalClose.addEventListener('click', closePreview);
        modalBackdrop.addEventListener('click', closePreview);
        document.addEventListener('keydown', (ev) => {
            if (ev.key === 'Escape' && previewModal.classList.contains('open')) {
                closePreview();
            }
        });

    </script>
</body>
</html>
